[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "framelink"
version = "0.2.0"
description = "Python reference implementation of framelink, a reliable framed messaging protocol for UART, TCP and BLE"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Guilherme Schwonka" }]
requires-python = ">=3.9"
keywords = ["serial", "uart", "protocol", "framing", "embedded", "flow-control", "crc16", "esp32", "stm32"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
test = ["pytest>=7"]

[project.scripts]
framelink = "framelink.cli:main"

[project.urls]
Homepage = "https://github.com/GSchwonka/framelink"
Specification = "https://github.com/GSchwonka/framelink/blob/main/docs/SPEC.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
